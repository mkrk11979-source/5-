<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЧистоСлов — Перевод из грубого в литературный</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: rgba(99, 102, 241, 0.15);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.2rem;
      color: #fff;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .promo-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 1) 0%, rgba(49, 46, 129, 0.4) 100%);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .promo-tag {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #a5b4fc;
      margin-bottom: 6px;
    }

    .promo-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #fff;
    }

    .promo-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .search-box {
      display: flex;
      gap: 8px;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
    }

    .search-input {
      width: 100%;
      background: var(--card);
      border: 1.5px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .submit-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 0 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .results-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .word-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .target-word {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      text-transform: capitalize;
    }

    .situations-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .situation-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px;
    }

    .situation-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #a5b4fc;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .phrases-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .phrase-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .phrase-text {
      font-size: 0.95rem;
      color: #f1f5f9;
      line-height: 1.3;
    }

    .mini-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      font-size: 1rem;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .mini-btn:hover {
      color: #fff;
    }

    .fact-card {
      background: rgba(99, 102, 241, 0.08);
      border: 1px dashed var(--accent);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .fact-header {
      font-size: 0.75rem;
      font-weight: 600;
      color: #a5b4fc;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .fact-body {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .loader {
      display: none;
      text-align: center;
      padding: 24px;
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="logo">
        <div class="logo-icon">ЧС</div>
        <span>ЧистоСлов AI</span>
      </div>
    </header>

    <div class="card promo-card">
      <div class="promo-tag">🌿 Чистая речь</div>
      <div class="promo-title">Окультуривай свой лексикон</div>
      <div class="promo-desc">Введи любое ругательство или разговорное слово — AI подберет красивую литературную замену под каждую ситуацию.</div>
    </div>

    <div class="search-box">
      <div class="input-wrapper">
        <input type="text" class="search-input" id="search-input" placeholder="Введите ругательство или разговорное слово..." autocomplete="off">
      </div>
      <button class="submit-btn" id="search-btn">Очистить</button>
    </div>

    <div class="loader" id="loader">✨ Подбираем ситуации и литературные выражения...</div>

    <div class="results-container" id="results-area" style="display: none;">
      <div class="card">
        <div class="word-header">
          <span class="target-word" id="target-word-title">Слово</span>
          <span style="font-size: 0.8rem; color: var(--text-muted);">Литературные замены:</span>
        </div>

        <div class="situations-list" id="situations-list"></div>
      </div>

      <div class="fact-card">
        <div class="fact-header">💡 Совет по культуре речи</div>
        <div class="fact-body" id="advice-body">...</div>
      </div>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const loader = document.getElementById('loader');
    const resultsArea = document.getElementById('results-area');
    const situationsList = document.getElementById('situations-list');
    const targetWordTitle = document.getElementById('target-word-title');
    const adviceBody = document.getElementById('advice-body');

    async function fetchAiData(word) {
      const url = "https://text.pollinations.ai/";

      const systemPrompt = `Ты эксперт по культуре речи и стилистике русского языка в приложении "ЧистоСлов".
Твоя задача: взять грубое, разговорное или матерное слово/выражение "${word}" и подобрать к нему ЛИТЕРАТУРНЫЕ замены, разделенные ПО РАЗНЫМ ТИПОВЫМ СИТУАЦИЯМ его применения.

Определи все самые актуальные и распространенные ситуации, где это слово используется (например: "О качестве предметов/услуг", "О лжи или дезинформации", "О беспорядке", "О выражении досады" и т.д.).
Для каждой ситуации предложи от 2 до 4 литературных фраз, оборотов или точных синонимов, которыми можно заменить это грубое слово.

Верни ответ СТРОГО в формате валидного JSON без разметки markdown, без \`\`\`json и без любого вводного текста:
{
  "word": "${word}",
  "advice": "Короткий стилистический совет, почему лучше отказаться от этого слова или чем заменить его эмоцию",
  "situations": [
    {
      "contextName": "Название ситуационного контекста (например: Если речь идет о качестве вещей)",
      "replacements": ["некачественная вещь", "низкопробный товар", "полный брак"]
    },
    {
      "contextName": "Название ситуационного контекста (например: Если речь идет о неправде)",
      "replacements": ["говорить небылицы", "вводить в заблуждение", "недостоверная информация"]
    }
  ]
}`;

      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: `Разбери слово: ${word}` }
          ],
          model: "openai",
          jsonMode: true
        })
      });

      if (!response.ok) {
        throw new Error("Ошибка API: " + response.status);
      }

      const textResponse = await response.text();
      const cleanJsonText = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
      return JSON.parse(cleanJsonText);
    }

    async function handleSearch() {
      const query = searchInput.value.trim();
      if (!query) return;

      loader.style.display = 'block';
      resultsArea.style.display = 'none';
      searchBtn.disabled = true;

      try {
        const data = await fetchAiData(query);
        renderResults(data);
      } catch (err) {
        console.error(err);
        alert("Произошла ошибка при обработке слова. Попробуйте еще раз.");
      } finally {
        loader.style.display = 'none';
        searchBtn.disabled = false;
      }
    }

    function renderResults(data) {
      targetWordTitle.textContent = data.word;
      adviceBody.textContent = data.advice || "Замена грубой лексики на точные литературные выражении делает вашу речь более убедительной и авторитетной.";

      situationsList.innerHTML = '';

      if (data.situations && data.situations.length > 0) {
        data.situations.forEach(sit => {
          const sitCard = document.createElement('div');
          sitCard.className = 'situation-card';

          let phrasesHtml = '';
          sit.replacements.forEach(phrase => {
            phrasesHtml += `
              <div class="phrase-item">
                <span class="phrase-text">${phrase}</span>
                <button class="mini-btn" onclick="copyText('${phrase}')" title="Скопировать">📋</button>
              </div>
            `;
          });

          sitCard.innerHTML = `
            <div class="situation-title">📌 ${sit.contextName}</div>
            <div class="phrases-list">${phrasesHtml}</div>
          `;

          situationsList.appendChild(sitCard);
        });
      }

      resultsArea.style.display = 'flex';
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      alert(`Скопировано: "${text}"`);
    }

    searchBtn.addEventListener('click', handleSearch);
    searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSearch(); });
  </script>
</body>
</html>
